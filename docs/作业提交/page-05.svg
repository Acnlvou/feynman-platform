<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#0B1F3A"/>
  <text x="56" y="60" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">登录状态：刷新后仍然知道你是谁</text>
  <text x="56" y="92" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="16" fill="#A9BED1">四个前端部件协作，把一次登录变成可复用的全局状态。</text>
  <g font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif"><rect x="56" y="154" width="184" height="118" rx="18" fill="#12365A"/><text x="80" y="194" font-size="18" font-weight="700" fill="#FFFFFF">AuthContext</text><text x="80" y="226" font-size="14" fill="#A9BED1">token · user · login</text><path d="M250 213 H282" stroke="#1BA6A6" stroke-width="4"/><path d="M276 204 l12 9 -12 9" fill="none" stroke="#1BA6A6" stroke-width="4"/>
  <rect x="294" y="154" width="184" height="118" rx="18" fill="#1BA6A6"/><text x="318" y="194" font-size="18" font-weight="700" fill="#0B1F3A">localStorage</text><text x="318" y="226" font-size="14" fill="#0B1F3A">feynman_token</text><path d="M488 213 H520" stroke="#1BA6A6" stroke-width="4"/><path d="M514 204 l12 9 -12 9" fill="none" stroke="#1BA6A6" stroke-width="4"/>
  <rect x="532" y="154" width="184" height="118" rx="18" fill="#12365A"/><text x="556" y="194" font-size="18" font-weight="700" fill="#FFFFFF">Axios 拦截器</text><text x="556" y="226" font-size="14" fill="#A9BED1">自动加 x-auth-token</text><path d="M726 213 H758" stroke="#1BA6A6" stroke-width="4"/><path d="M752 204 l12 9 -12 9" fill="none" stroke="#1BA6A6" stroke-width="4"/>
  <rect x="770" y="154" width="134" height="118" rx="18" fill="#FFB454"/><text x="782" y="194" font-size="16" font-weight="700" fill="#0B1F3A">Route Guard</text><text x="782" y="226" font-size="13" fill="#0B1F3A">无 Token → 登录</text></g>
  <rect x="56" y="318" width="848" height="112" rx="18" fill="#F6F8FC"/><text x="84" y="355" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="700" fill="#0B1F3A">实现效果</text><text x="84" y="392" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="16" fill="#26364A">登录成功保存 Token；刷新页面恢复状态；访问受保护页面前先检查登录。</text>
  <text x="56" y="482" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14" fill="#A9BED1">对应实现：AuthContext.jsx · client.js 请求拦截器 · ProtectedRoute.jsx · App.jsx</text><text x="904" y="516" text-anchor="end" font-family="Arial,sans-serif" font-size="14" fill="#91A7BD">05 / 07</text>
</svg>