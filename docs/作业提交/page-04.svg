<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#F6F8FC"/><rect width="960" height="10" fill="#FFB454"/>
  <text x="56" y="60" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="32" font-weight="700" fill="#0B1F3A">一次登录请求，完整走过四层</text>
  <text x="56" y="91" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="16" fill="#5C7187">页面只负责采集输入；状态和 Token 由 Context 统一管理。</text>
  <g font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif"><rect x="56" y="154" width="186" height="112" rx="18" fill="#0B1F3A"/><text x="80" y="196" font-size="18" font-weight="700" fill="#FFFFFF">① LoginPage</text><text x="80" y="228" font-size="14" fill="#B9C9DB">login(form)</text><path d="M252 210 H286" stroke="#1BA6A6" stroke-width="4"/><path d="M280 201 l12 9 -12 9" fill="none" stroke="#1BA6A6" stroke-width="4"/>
  <rect x="298" y="154" width="186" height="112" rx="18" fill="#1BA6A6"/><text x="322" y="196" font-size="18" font-weight="700" fill="#0B1F3A">② AuthContext</text><text x="322" y="228" font-size="14" fill="#0B1F3A">调用登录方法</text><path d="M494 210 H528" stroke="#1BA6A6" stroke-width="4"/><path d="M522 201 l12 9 -12 9" fill="none" stroke="#1BA6A6" stroke-width="4"/>
  <rect x="540" y="154" width="186" height="112" rx="18" fill="#12365A"/><text x="564" y="196" font-size="18" font-weight="700" fill="#FFFFFF">③ Axios</text><text x="564" y="228" font-size="14" fill="#B9C9DB">POST /users/login</text><path d="M736 210 H770" stroke="#1BA6A6" stroke-width="4"/><path d="M764 201 l12 9 -12 9" fill="none" stroke="#1BA6A6" stroke-width="4"/>
  <rect x="782" y="154" width="122" height="112" rx="18" fill="#FFB454"/><text x="800" y="196" font-size="18" font-weight="700" fill="#0B1F3A">④ 后端</text><text x="800" y="228" font-size="14" fill="#0B1F3A">data.token</text></g>
  <rect x="56" y="312" width="848" height="112" rx="18" fill="#FFFFFF" stroke="#DCE5EF"/><text x="84" y="349" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="19" font-weight="700" fill="#0B1F3A">返回之后</text><text x="84" y="386" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="16" fill="#26364A">保存 Token → <tspan fill="#147A7A" font-weight="700">localStorage</tspan> → 更新认证状态 → <tspan fill="#A26711" font-weight="700">navigate()</tspan> 跳转学习空间</text>
  <text x="56" y="482" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif" font-size="14" fill="#5C7187">实际请求：apiClient.post('/users/login', credentials) · 后端返回 data.token</text><text x="904" y="516" text-anchor="end" font-family="Arial,sans-serif" font-size="14" fill="#71869A">04 / 07</text>
</svg>